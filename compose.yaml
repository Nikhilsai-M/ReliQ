services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, '--appendonly', 'yes', '--appendfsync', everysec]
    ports:
      - '127.0.0.1:16379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reliq
      POSTGRES_PASSWORD: reliq
      POSTGRES_DB: reliq
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, reliq, -d, reliq]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  redis-data:
  postgres-data:
